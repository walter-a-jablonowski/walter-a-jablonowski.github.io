<svg viewBox="0 0 560 420" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <title>Invoice intake walkthrough: read the document, extract the data, match it against the order, have a person approve it, post it to the ERP</title>

  <!-- Background -->
  <rect width="560" height="420" fill="#1a1a1a"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FF6B00"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FFC107"/>
    </marker>
  </defs>

  <!-- Start: an invoice arrives -->
  <rect x="20" y="12" width="240" height="32" rx="16" fill="#2d2d2d" stroke="#666" stroke-width="1.5"/>
  <text x="140" y="33" text-anchor="middle" fill="#ffffff" font-size="14">An invoice arrives</text>
  <line x1="140" y1="44" x2="140" y2="62" stroke="#FF6B00" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 1: read the document -->
  <rect x="20" y="64" width="240" height="52" rx="8" fill="#2d2d2d" stroke="#FF6B00" stroke-width="2"/>
  <text x="140" y="88" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="600">Read it</text>
  <text x="140" y="106" text-anchor="middle" fill="#999999" font-size="11.5">PDF &#183; XML &#183; scan &#183; OCR</text>

  <line x1="260" y1="90" x2="296" y2="90" stroke="#FFC107" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="296" y="68" width="244" height="44" rx="8" fill="none" stroke="#FFC107" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="418" y="88" text-anchor="middle" fill="#FFC107" font-size="13" font-weight="600">E-invoice (XML)</text>
  <text x="418" y="105" text-anchor="middle" fill="#999999" font-size="11.5">exact, no AI needed</text>

  <line x1="140" y1="116" x2="140" y2="134" stroke="#FF6B00" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: extract the fields -->
  <rect x="20" y="136" width="240" height="52" rx="8" fill="#2d2d2d" stroke="#FF6B00" stroke-width="2"/>
  <text x="140" y="160" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="600">Extract the data</text>
  <text x="140" y="178" text-anchor="middle" fill="#999999" font-size="11.5">amount &#183; date &#183; line items</text>

  <line x1="260" y1="162" x2="296" y2="162" stroke="#FFC107" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="296" y="140" width="244" height="44" rx="8" fill="none" stroke="#FFC107" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="418" y="160" text-anchor="middle" fill="#FFC107" font-size="13" font-weight="600">Total &#183; VAT &#183; IBAN</text>
  <text x="418" y="177" text-anchor="middle" fill="#999999" font-size="11.5">checked, not guessed</text>

  <line x1="140" y1="188" x2="140" y2="206" stroke="#FF6B00" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: match against the order -->
  <rect x="20" y="208" width="240" height="52" rx="8" fill="#2d2d2d" stroke="#FF6B00" stroke-width="2"/>
  <text x="140" y="232" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="600">Match</text>
  <text x="140" y="250" text-anchor="middle" fill="#999999" font-size="11.5">order &#183; goods receipt</text>

  <!-- Side branch: an agent investigates a mismatch, read-only -->
  <line x1="260" y1="234" x2="292" y2="234" stroke="#FF6B00" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <rect x="296" y="206" width="244" height="52" rx="8" fill="#2d2d2d" stroke="#FF6B00" stroke-width="2"/>
  <text x="418" y="230" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="600">Investigator</text>
  <text x="418" y="248" text-anchor="middle" fill="#999999" font-size="11.5">only when something is off</text>

  <line x1="140" y1="260" x2="140" y2="278" stroke="#FF6B00" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: the human gate -->
  <rect x="20" y="280" width="240" height="56" rx="8" fill="#2d2d2d" stroke="#FFC107" stroke-width="2"/>
  <circle cx="41" cy="299" r="5" fill="none" stroke="#FFC107" stroke-width="1.5"/>
  <path d="M33,314 q8,-10 16,0" fill="none" stroke="#FFC107" stroke-width="1.5"/>
  <text x="140" y="304" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="600">Approval</text>
  <text x="140" y="323" text-anchor="middle" fill="#999999" font-size="11.5">a person &#183; four eyes</text>

  <line x1="260" y1="308" x2="292" y2="308" stroke="#FFC107" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowAmber)"/>
  <rect x="296" y="284" width="244" height="48" rx="8" fill="none" stroke="#FFC107" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="418" y="304" text-anchor="middle" fill="#FFC107" font-size="12.5" font-weight="600">Due date &#183; reminder &#183; escalation</text>
  <text x="418" y="321" text-anchor="middle" fill="#999999" font-size="11.5">the run waits, even for days</text>

  <line x1="140" y1="336" x2="140" y2="354" stroke="#FF6B00" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Result -->
  <rect x="20" y="356" width="240" height="32" rx="16" fill="#2d2d2d" stroke="#FFC107" stroke-width="1.5"/>
  <text x="140" y="377" text-anchor="middle" fill="#FFC107" font-size="14" font-weight="600">Posted to the ERP</text>

  <!-- What the system does without being asked -->
  <text x="280" y="407" text-anchor="middle" fill="#888888" font-size="11">Retries, double-posting protection and the audit trail run by themselves</text>
</svg>
