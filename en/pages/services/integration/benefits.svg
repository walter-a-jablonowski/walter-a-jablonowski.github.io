<svg xmlns="http://www.w3.org/2000/svg" width="800" height="883" viewBox="0 0 800 883" role="img" aria-labelledby="t">
  <title id="t">The AI works from real data, you decide the scope, one standard instead of point solutions</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19191b"/>
      <stop offset="1" stop-color="#09090a"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6B00"/>
      <stop offset="1" stop-color="#FF3E00"/>
    </linearGradient>
    <linearGradient id="row" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f1c1a"/>
      <stop offset="1" stop-color="#161413"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0" stop-color="#FF6B00" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FF6B00" stop-opacity="0"/>
    </radialGradient>
    <filter id="gl" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#FF6B00" flood-opacity="0.45"/>
    </filter>

    <!-- Real records flow to the AI instead of it guessing -->
    <g id="icRealData">
      <g fill="none" stroke="#170f08" stroke-width="5">
        <ellipse cx="-14" cy="-18" rx="18" ry="7"/>
        <path d="M-32 -18 V14 A18 7 0 0 0 4 14 V-18"/>
        <path d="M-32 -2 A18 7 0 0 0 4 -2" stroke-opacity=".5"/>
      </g>
      <path d="M12 0 H34" fill="none" stroke="#170f08" stroke-width="6" stroke-linecap="round"/>
      <path d="M26 -8 L34 0 L26 8" fill="none" stroke="#170f08" stroke-width="6"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- It slots into what is already there: knob and socket carry the meaning,
         so both are drawn large enough to survive the 320px render -->
    <g id="icPuzzle">
      <path d="M-30 -26 H16 V-13 A13 13 0 0 1 16 13 V26 H-30 V13 A13 13 0 0 0 -30 -13 Z"
            fill="none" stroke="#170f08" stroke-width="5" stroke-linejoin="round"/>
    </g>

    <!-- One protocol in the middle, many systems around it -->
    <g id="icHub">
      <g stroke="#170f08" stroke-width="5" stroke-linecap="round">
        <path d="M0 -13 V-26 M0 13 V26 M-13 0 H-26 M13 0 H26"/>
      </g>
      <circle cx="0" cy="0" r="11" fill="#170f08"/>
      <g fill="#170f08">
        <circle cx="0" cy="-36" r="7"/>
        <circle cx="0" cy="36" r="7"/>
        <circle cx="-36" cy="0" r="7"/>
        <circle cx="36" cy="0" r="7"/>
      </g>
    </g>
  </defs>

  <rect width="800" height="883" rx="28" fill="url(#bg)"/>
  <rect width="800" height="883" rx="28" fill="url(#glow)"/>

  <!-- Real data -->
  <rect x="56" y="68" width="688" height="248" rx="20" fill="url(#row)" stroke="#FF6B00" stroke-opacity=".2" stroke-width="2"/>
  <g filter="url(#gl)">
    <rect x="88" y="140" width="104" height="104" rx="26" fill="url(#acc)"/>
  </g>
  <use href="#icRealData" x="140" y="192"/>
  <text x="220" y="190" font-family="Roboto, Segoe UI, Arial, sans-serif" font-size="58" font-weight="700" fill="#ffffff">Real data</text>
  <text x="220" y="234" font-family="Roboto, Segoe UI, Arial, sans-serif" font-size="32" fill="#FFC107">the AI stops guessing</text>

  <!-- You decide -->
  <rect x="56" y="324" width="688" height="248" rx="20" fill="url(#row)" stroke="#FF6B00" stroke-opacity=".2" stroke-width="2"/>
  <g filter="url(#gl)">
    <rect x="88" y="396" width="104" height="104" rx="26" fill="url(#acc)"/>
  </g>
  <use href="#icPuzzle" x="140" y="448"/>
  <text x="220" y="446" font-family="Roboto, Segoe UI, Arial, sans-serif" font-size="58" font-weight="700" fill="#ffffff">You decide</text>
  <text x="220" y="490" font-family="Roboto, Segoe UI, Arial, sans-serif" font-size="32" fill="#FFC107">connect, extend or replace</text>

  <!-- One standard -->
  <rect x="56" y="580" width="688" height="248" rx="20" fill="url(#row)" stroke="#FF6B00" stroke-opacity=".2" stroke-width="2"/>
  <g filter="url(#gl)">
    <rect x="88" y="652" width="104" height="104" rx="26" fill="url(#acc)"/>
  </g>
  <use href="#icHub" x="140" y="704"/>
  <text x="220" y="702" font-family="Roboto, Segoe UI, Arial, sans-serif" font-size="58" font-weight="700" fill="#ffffff">One standard</text>
  <text x="220" y="746" font-family="Roboto, Segoe UI, Arial, sans-serif" font-size="32" fill="#FFC107">MCP instead of point solutions</text>
</svg>
