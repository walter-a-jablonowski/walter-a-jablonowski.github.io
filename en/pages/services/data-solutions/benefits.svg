<svg xmlns="http://www.w3.org/2000/svg" width="800" height="883" viewBox="0 0 800 883" role="img" aria-labelledby="t">
  <title id="t">Find information instantly, knowledge stays in-house, clean data as the basis for AI</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19191b"/>
      <stop offset="1" stop-color="#09090a"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6B00"/>
      <stop offset="1" stop-color="#FF3E00"/>
    </linearGradient>
    <linearGradient id="row" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f1c1a"/>
      <stop offset="1" stop-color="#161413"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0" stop-color="#FF6B00" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FF6B00" stop-opacity="0"/>
    </radialGradient>
    <filter id="gl" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#FF6B00" flood-opacity="0.45"/>
    </filter>

    <!-- The one item found among many -->
    <g id="icFind">
      <g fill="#170f08">
        <rect x="-30" y="-27" width="40" height="7" rx="3.5"/>
        <rect x="-30" y="-15" width="52" height="7" rx="3.5" fill-opacity=".7"/>
        <rect x="-30" y="-3" width="30" height="7" rx="3.5" fill-opacity=".5"/>
      </g>
      <circle cx="10" cy="12" r="14" fill="#1f1c1a" stroke="#170f08" stroke-width="5"/>
      <path d="M20 22 L30 32" stroke="#170f08" stroke-width="7" stroke-linecap="round"/>
    </g>

    <!-- The company's own store of knowledge, kept -->
    <g id="icStore" fill="none" stroke="#170f08" stroke-width="5">
      <ellipse cx="0" cy="-18" rx="26" ry="9"/>
      <path d="M-26 -18 V18 A26 9 0 0 0 26 18 V-18"/>
      <path d="M-26 -6 A26 9 0 0 0 26 -6" stroke-opacity=".5"/>
      <path d="M-26 6 A26 9 0 0 0 26 6" stroke-opacity=".5"/>
    </g>

    <!-- Clean data, ready to be used by AI -->
    <g id="icReady">
      <g fill="none" stroke="#170f08" stroke-width="5" stroke-linecap="round">
        <rect x="-17" y="-17" width="34" height="34" rx="7"/>
        <path d="M-8 -17 V-25 M8 -17 V-25 M-8 17 V25 M8 17 V25 M-17 -8 H-25 M-17 8 H-25 M17 -8 H25 M17 8 H25"/>
      </g>
      <rect x="-7" y="-7" width="14" height="14" rx="3" fill="#170f08"/>
      <path d="M30 -35 L33 -27 L41 -24 L33 -21 L30 -13 L27 -21 L19 -24 L27 -27 Z" fill="#170f08"/>
    </g>
  </defs>

  <rect width="800" height="883" rx="28" fill="url(#bg)"/>
  <rect width="800" height="883" rx="28" fill="url(#glow)"/>

  <!-- Found instantly -->
  <rect x="56" y="68" width="688" height="248" rx="20" fill="url(#row)" stroke="#FF6B00" stroke-opacity=".2" stroke-width="2"/>
  <g filter="url(#gl)">
    <rect x="88" y="140" width="104" height="104" rx="26" fill="url(#acc)"/>
  </g>
  <use href="#icFind" x="140" y="192"/>
  <text x="220" y="190" font-family="Roboto, Segoe UI, Arial, sans-serif" font-size="58" font-weight="700" fill="#ffffff">Found instantly</text>
  <text x="220" y="234" font-family="Roboto, Segoe UI, Arial, sans-serif" font-size="32" fill="#FFC107">seconds instead of hours</text>

  <!-- Knowledge stays -->
  <rect x="56" y="324" width="688" height="248" rx="20" fill="url(#row)" stroke="#FF6B00" stroke-opacity=".2" stroke-width="2"/>
  <g filter="url(#gl)">
    <rect x="88" y="396" width="104" height="104" rx="26" fill="url(#acc)"/>
  </g>
  <use href="#icStore" x="140" y="448"/>
  <text x="220" y="446" font-family="Roboto, Segoe UI, Arial, sans-serif" font-size="58" font-weight="700" fill="#ffffff">Knowledge stays</text>
  <text x="220" y="490" font-family="Roboto, Segoe UI, Arial, sans-serif" font-size="32" fill="#FFC107">even when people leave</text>

  <!-- Ready for AI -->
  <rect x="56" y="580" width="688" height="248" rx="20" fill="url(#row)" stroke="#FF6B00" stroke-opacity=".2" stroke-width="2"/>
  <g filter="url(#gl)">
    <rect x="88" y="652" width="104" height="104" rx="26" fill="url(#acc)"/>
  </g>
  <use href="#icReady" x="140" y="704"/>
  <text x="220" y="702" font-family="Roboto, Segoe UI, Arial, sans-serif" font-size="58" font-weight="700" fill="#ffffff">Ready for AI</text>
  <text x="220" y="746" font-family="Roboto, Segoe UI, Arial, sans-serif" font-size="32" fill="#FFC107">clean data as the basis</text>
</svg>
