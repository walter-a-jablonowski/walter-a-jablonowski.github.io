<svg viewBox="0 0 320 244" xmlns="http://www.w3.org/2000/svg" role="img"
  font-family="'Segoe UI', Arial, sans-serif"
  aria-label="Office Agent: a document goes to the agent and ends at a human approval">
  <title>Office Agent - document, agent, human approval</title>

  <!-- Card thumbnail: 320x244 matches the .project-image box on desktop (236x180).
       On narrow cards object-fit:cover crops to about x 34-286, so every shape
       stays inside x 70-250. The one word reads the same in German and English,
       so a single file serves both index pages. -->

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232326"/>
      <stop offset="1" stop-color="#131315"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.53" r="0.55">
      <stop offset="0" stop-color="#FF6B00" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#FF6B00" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FF6B00"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <rect width="320" height="244" fill="url(#bg)"/>
  <rect width="320" height="244" fill="url(#glow)"/>

  <!-- The incoming document -->
  <rect x="128" y="16" width="64" height="68" rx="7" fill="#2d2d2d" stroke="#8a8a8a" stroke-width="2.2"/>
  <path d="M140,38 H180" stroke="#8a8a8a" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M140,52 H180" stroke="#8a8a8a" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M140,66 H168" stroke="#8a8a8a" stroke-width="3.4" stroke-linecap="round"/>

  <line x1="160" y1="84" x2="160" y2="100" stroke="#8a8a8a" stroke-width="2.6" marker-end="url(#arrowGrey)"/>

  <!-- The agent that does the work -->
  <rect x="70" y="102" width="180" height="54" rx="11" fill="#2d2d2d" stroke="#FF6B00" stroke-width="2.8"/>
  <text x="160" y="139" text-anchor="middle" fill="#FF6B00" font-size="30" font-weight="600">Agent</text>

  <line x1="160" y1="156" x2="160" y2="172" stroke="#FF6B00" stroke-width="2.6" marker-end="url(#arrow)"/>

  <!-- The human gate at the end -->
  <rect x="70" y="174" width="180" height="54" rx="11" fill="#2d2d2d" stroke="#FFC107" stroke-width="2.8"/>
  <circle cx="133" cy="194" r="9" fill="none" stroke="#FFC107" stroke-width="2.2"/>
  <path d="M119,216 q14,-17 28,0" fill="none" stroke="#FFC107" stroke-width="2.2"/>
  <path d="M171,203 l10,10 l21,-23" fill="none" stroke="#FFC107" stroke-width="3.8"
    stroke-linecap="round" stroke-linejoin="round"/>
</svg>
